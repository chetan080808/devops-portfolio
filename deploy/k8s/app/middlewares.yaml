# Traefik middlewares, referenced from the Ingress annotations as
# "<namespace>-<name>@kubernetescrd".

# www.chetannamane.com/<path> -> https://chetannamane.com/<path> (301), on HTTP and HTTPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
  namespace: portfolio
spec:
  redirectRegex:
    regex: ^https?://www\.chetannamane\.com/(.*)
    replacement: https://chetannamane.com/${1}
    permanent: true
---
# Plain HTTP -> HTTPS (301).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: portfolio
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: portfolio
spec:
  headers:
    # One year of HTTPS-only. No includeSubDomains/preload yet: future subdomains (Phase 9) must
    # have TLS first.
    stsSeconds: 31536000
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
