# cert-manager, installed by k3s' built-in Helm controller (no helm binary needed on the node or
# in CI). It issues and renews the Let's Encrypt certificate. Nothing is requested until a
# Certificate is applied (deploy/k8s/tls/).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: v1.21.2
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |-
    crds:
      enabled: true
      keep: true
    prometheus:
      enabled: false
    # Small node (2 GiB): explicit requests so the scheduler accounts for it, memory limits so
    # a leak can't starve the site.
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 192Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 24Mi }
        limits: { memory: 96Mi }
    cainjector:
      resources:
        requests: { cpu: 10m, memory: 40Mi }
        limits: { memory: 160Mi }
    startupapicheck:
      enabled: false
