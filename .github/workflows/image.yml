# Build the container image on every push to main and publish it to GHCR, tagged with the full
# commit SHA (the tag the cluster deploys). Uses the workflow's own GITHUB_TOKEN: no personal
# tokens. Phase 7d extends this into the full pipeline (lint -> build -> Trivy -> push -> deploy).
name: image

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "infra/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false # never cancel a push halfway

env:
  IMAGE: ghcr.io/chetan080808/devops-portfolio # GHCR names must be lowercase

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
