# CI/CD: lint → build (amd64 + arm64) → Trivy scan → push → multi-arch tag → deploy → smoke test.
#
# - Pull requests run lint, build and the scan only (nothing is pushed or deployed).
# - Pushes to main also push the image (tagged with the full commit SHA) and deploy it.
# - Deploy runs in the GitHub environment "production" (deployment branch rule: main only) and
#   gets short-lived AWS credentials through OIDC: no AWS keys are stored in GitHub. It sends the
#   SSM deploy document to the k3s node with one parameter, the commit SHA (scripts/deploy-ssm.sh;
#   the role can send nothing else); the node applies deploy/k8s/app from that commit of main.
#   The Kubernetes API is never exposed. Until the repository variable AWS_DEPLOY_ROLE_ARN exists,
#   the deploy job is skipped.
# - Every third-party action is pinned to a full commit SHA (tags can be moved).
name: ci-cd

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "infra/**", "**/*.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One pipeline per branch; on main never cancel a run halfway (it may be deploying).
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/chetan080808/devops-portfolio # GHCR names must be lowercase
  NODE_VERSION: "24.21.0" # same as the Dockerfile's base image

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Next generates route/layout types (e.g. the global LayoutProps) into .next/types; a fresh
      # checkout has none, so tsc fails without this step.
      - name: Generate Next.js types
        run: npx next typegen
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src

  # One native build per architecture (no QEMU emulation): amd64 on the standard runner, arm64 on
  # GitHub's arm64 runner (free for public repositories). Each image is scanned before it is pushed
  # (as <sha>-<arch>); the manifest job then publishes both under the one tag the node pulls, <sha>,
  # and the node's container runtime picks its own architecture.
  build:
    needs: lint
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      ARCH_TAG: ${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build metadata
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build into the local Docker daemon first: the image that gets scanned is the image that
      # gets pushed (docker push below), not a rebuild.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.ARCH_TAG }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            CI_RUN_ID=${{ github.run_id }}
            CI_RUN_NUMBER=${{ github.run_number }}
          # One cache per architecture (they share no layers).
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          provenance: false

      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}:${{ env.ARCH_TAG }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # The architecture's native prebuilt binaries must be in the image (sharp/libvips for
      # next/image, the Node runtime itself): fail here, not on the node.
      - name: Image smoke test
        run: |
          docker run --rm --env WANT --entrypoint node "$IMAGE:$ARCH_TAG" -e '
            const arch = { amd64: "x64", arm64: "arm64" }[process.env.WANT];
            if (process.arch !== arch) throw new Error(`node is ${process.arch}, want ${arch}`);
            const sharp = require("/app/node_modules/sharp");
            console.log(`node ${process.version} ${process.arch}, sharp ${sharp.versions.sharp} (libvips ${sharp.versions.vips})`);
          ' -- 2>&1
        env:
          WANT: ${{ matrix.arch }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.PUBLISH == 'true'
        run: docker push "$IMAGE:$ARCH_TAG"

  # Both scanned per-architecture images under one multi-arch tag (an OCI image index).
  manifest:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ${{ github.sha }} (amd64 + arm64)
        run: |
          docker buildx imagetools create -t "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"

  deploy:
    needs: manifest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://chetannamane.com
    permissions:
      contents: read
      id-token: write # request the OIDC token that AWS exchanges for the deploy role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ap-south-1

      - name: Deploy to k3s (SSM deploy document)
        run: scripts/deploy-ssm.sh "$GITHUB_SHA"

      # The page names its build in every asset URL (?dpl=<sha>): this proves the new release is
      # what visitors get, not just that some pod answers.
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://chetannamane.com/api/healthz >/dev/null \
               && curl -fsS --max-time 10 https://chetannamane.com/ | grep -q "dpl=$GITHUB_SHA"; then
              echo "live: $GITHUB_SHA"; exit 0
            fi
            sleep 10
          done
          echo "::error::https://chetannamane.com does not serve $GITHUB_SHA"; exit 1
